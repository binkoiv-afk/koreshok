name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  # Mirrored at workflow level so step conditions can test whether the secret exists.
  KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      # The signing key is created here, once, encrypted with the owner's own KEYSTORE_PASSWORD
      # secret, and committed; nobody else ever sees the password.
      - name: Create signing key on first run
        if: github.event_name == 'push' && env.KEYSTORE_PASSWORD != '' && hashFiles('app/signing/koreshok.jks') == ''
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          mkdir -p app/signing
          keytool -genkeypair -keystore app/signing/koreshok.jks -storetype PKCS12 -alias koreshok \
            -keyalg RSA -keysize 4096 -validity 36500 \
            -storepass "$KEYSTORE_PASSWORD" -keypass "$KEYSTORE_PASSWORD" -dname "CN=Koreshok"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/signing/koreshok.jks
          git commit -m "Add release signing key"
          git push
      - name: Test and build
        run: ./gradlew :core:test :app:assembleRelease
        env:
          VERSION_CODE: ${{ github.run_number }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk koreshok.apk
      - uses: actions/upload-artifact@v4
        with:
          name: koreshok-apk
          path: koreshok.apk
      # Every build of main becomes the latest release, so
      # https://github.com/binkoiv-afk/koreshok/releases/latest/download/koreshok.apk always has the newest APK.
      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Сборка ${{ github.run_number }}
          body: ${{ github.event.head_commit.message }}
          files: koreshok.apk
          make_latest: true
