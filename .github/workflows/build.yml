name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and build
        run: ./gradlew :core:test :app:assembleRelease
      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk koreshok.apk
      - uses: actions/upload-artifact@v4
        with:
          name: koreshok-apk
          path: koreshok.apk
      # Every build of main becomes the latest release, so
      # https://github.com/binkoiv-afk/koreshok/releases/latest/download/koreshok.apk always has the newest APK.
      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Сборка ${{ github.run_number }}
          body: ${{ github.event.head_commit.message }}
          files: koreshok.apk
          make_latest: true
