name: Probe catalogs

# Manual check that OPDS catalogs answer, and what their search links look like.
# The report is attached to the "probe" pre-release, since job logs are not always reachable.
on:
  workflow_dispatch:
    inputs:
      urls:
        description: Space-separated catalog URLs
        required: true
      bytes:
        description: How much of each answer to keep
        required: false
        default: "3000"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch
        env:
          URLS: ${{ inputs.urls }}
          BYTES: ${{ inputs.bytes }}
        run: |
          set +e
          for u in $URLS; do
            echo "=================== $u"
            curl -sS -L -m 20 -A "Koreshok/0.1 (Android)" -o body -w "HTTP %{http_code} %{content_type} -> %{url_effective}\n" "$u" 2>&1 || true
            head -c "${BYTES:-3000}" body 2>/dev/null; echo
            rm -f body
          done > report.txt
      - name: Publish report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view probe -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create probe -R "$GITHUB_REPOSITORY" --prerelease --latest=false --title "Служебное" --notes "Служебные отчёты сборки, не для установки."
          gh release upload probe report.txt -R "$GITHUB_REPOSITORY" --clobber
